// ========== FUNÇÃO COMANDO DE VOZ ==========
"funcoes/co-de-voz/voz.js": `// K-AI - COMANDO DE VOZ - BOTÃO LIGA 1x / DESLIGA SOZINHO EM 5s
let rec=null, ouvindo=false, textoBase='', timer2s=null, timer5s=null, perguntou=false;
const CORRECOES={'k ai':'K-AI','kai':'K-AI','supa base':'Supabase','github':'GitHub','gith hub':'GitHub'};
function corrigirTexto(t){ let s=' '+t.toLowerCase()+' '; for(const [e,c] of Object.entries(CORRECOES)){ s=s.split(e).join(' '+c+' '); } s=s.replace(/\\s+/g,' ').trim(); if(!s) return s; return s.charAt(0).toUpperCase()+s.slice(1); }
function toggleMic(){
  if(ouvindo){ pararVoz(); return; }
  if(!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)){ alert('Use Chrome no celular para a voz funcionar.'); return; }
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; rec=new SR();
  rec.lang='pt-BR'; rec.continuous=true; rec.interimResults=true; rec.maxAlternatives=1;
  textoBase=document.getElementById('input').value; ouvindo=true; perguntou=false;
  const btn=document.getElementById('btnMic'), st=document.getElementById('statusVoz');
  btn.classList.add('on'); btn.innerText='🔴'; st.className='ouvindo'; st.innerText='● OUVINDO... fale agora - botão ativo';
  rec.onresult=(e)=>{
    let interim='';
    for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal){ textoBase=(textoBase+' '+r[0].transcript).trim(); } else { interim+=r[0].transcript; } }
    document.getElementById('input').value=corrigirTexto(textoBase+' '+interim);
    perguntou=false;
    const st2=document.getElementById('statusVoz'); st2.className='ouvindo'; st2.innerText='● Digitando em tempo real: "'+document.getElementById('input').value.substring(0,60)+'..."';
    clearTimeout(timer2s); clearTimeout(timer5s);
    timer2s=setTimeout(()=>{
      if(!ouvindo) return; perguntou=true;
      const st3=document.getElementById('statusVoz'); st3.className='pergunta'; st3.innerText='❓ Você já terminou? Posso fazer o que você falou? Continue falando se quiser.';
      timer5s=setTimeout(()=>{ if(ouvindo && perguntou){ pararVoz(); if(document.getElementById('input').value.trim().length>2) enviar(); } }, 3000);
    }, 2000);
  };
  rec.onend=()=>{ if(ouvindo){ try{rec.start();}catch(_){} } };
  rec.onerror=(e)=>{ if(e.error==='not-allowed') alert('Permita o microfone no navegador.'); };
  rec.start();
}
function pararVoz(){ ouvindo=false; clearTimeout(timer2s); clearTimeout(timer5s); const b=document.getElementById('btnMic'); if(b){ b.classList.remove('on'); b.innerText='🎤'; } const s=document.getElementById('statusVoz'); if(s){ s.className=''; s.innerText='🎤 Toque 1x no microfone para falar de novo'; } if(rec) try{rec.stop();}catch(_){} }
`,

"funcoes/co-de-voz/DESCRICAO-DA-FUNCAO.md": `# DESCRIÇÃO DA FUNÇÃO: COMANDO DE VOZ - K-AI APP\n\n## Objetivo\nFazer o K-AI funcionar também com comando de voz.\n\n## Como funciona\n1. Usuário clica 1x no botão 🎤 no chat do K-AI para ativar o comando de voz. O botão fica ativo enquanto ele estiver falando.\n2. Enquanto ele fala, o K-AI vai digitando na hora em tempo real no chat tudo exatamente como ele falar.\n3. Reconhece com máxima precisão cada palavra, cada letra, cada sentido das falas e pedidos.\n4. Nunca permite digitar palavras que não existem. Corrige na hora: ex: kai -> K-AI, github -> GitHub.\n5. Reconhece automaticamente, instantâneo e rápido em tempo real, todas as falas, palavras, cada letra, cada sentido, pedidos.\n6. Reconhece quando o usuário falar o que quer que ele faça.\n\n## Regra dos 2 segundos até 5 segundos\n- Se o usuário parar de falar por 2 segundos, o K-AI pergunta: "Você já terminou? Posso fazer o que você falou?"\n- Se o usuário falar alguma coisa entre 2, 3 ou 4 segundos, o K-AI digita rápido continuando o que ele falou antes de ficar 2 segundos sem falar, e continua digitando as falas seguintes.\n- Se o usuário não falar mais nada de 2 segundos até 5 segundos sem interrupção, quando der 5 segundos o botão desliga sozinho e o K-AI envia e faz o que foi pedido.\n- Para ativar de novo, basta clicar 1x no botão de novo.\n- O K-AI sempre digita de onde parou até as últimas falas que foram faladas antes de parar.\n\n## Outro modo\n- Se o usuário enviar os pedidos digitando no chat, também funciona certo, do mesmo jeito.\n\n## Microfone do celular\n- Funciona real no Chrome no celular, usando o microfone do celular. É preciso permitir o microfone no navegador.\n\n## Arquivos desta função\n- voz.js: código da função de voz\n- DESCRICAO-DA-FUNCAO.md: este arquivo, descreve o funcionamento\n`,

"funcoes/co-de-voz/README.md": `# Função: Comando de Voz\n\nPasta: funcoes/co-de-voz/\nPrincipal: voz.js\nDescrição: DESCRICAO-DA-FUNCAO.md\nUsado em: kai-app.html\n`,

"funcoes/k-ai/DESCRICAO-DA-FUNCAO.md": `# DESCRIÇÃO DA FUNÇÃO: K-AI\n\n## Objetivo\nK-AI é a IA única evoluída, fusão de Gemini + Groq + Pollinations.\n\n## Como funciona\n- Recebe prompt por texto digitado ou por voz.\n- Entende o pedido, cria textos, ideias, códigos, imagens.\n- Manda comandos para Supabase e GitHub.\n- Responde no chat em tempo real.\n`,

async function enviarMestre(){
  const token=document.getElementById('KAI_TOKEN').value.trim();
  const repo=document.getElementById('repo').value.trim();
  if(!token) return alert('Cola seu KAI_TOKEN primeiro');
  logEl.innerHTML='🚀 ENVIAR iniciado em '+repo+'...';
  const [owner, repoName]=repo.split('/');
  for(const [path, content] of Object.entries(FILES)){
    try{
      let sha=null;
      const getRes=await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${path}`,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
      if(getRes.ok){ const j=await getRes.json(); sha=j.sha; }
      const putRes=await fetch(`https://api.github.com/repos/${owner}/${repoName}/contents/${path}`,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify({message: sha ? 'K-AI MESTRE: ajusta '+path+' sem excluir, adiciona voz' : 'K-AI MESTRE: cria '+path+' da função voz', content:b64(content), ...(sha?{sha}:{})})});
      const pj=await putRes.json();
      if(putRes.ok) log((sha?'🔄 ATUALIZADO SEM EXCLUIR: ':'✨ CRIADO: ')+path+' ✅');
      else log('❌ ERRO '+path+': '+(pj.message||putRes.status));
    }catch(e){ log('❌ ERRO '+path+': '+e.message); }
  }
  log('\n🏁 FIM! Abre o kai-app.html e testa a voz.');
}
