<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<title>K-AI</title>
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#000;color:#fff;display:flex;height:100vh;overflow:hidden}
@keyframes pulse{0%,100%{box-shadow:0 0 10px #00e5ff,0 0 20px #00e5ff}50%{box-shadow:0 0 25px #00e5ff,0 0 45px #00e5ff}}
#menu{width:290px;background:#050a0c;position:fixed;left:-300px;top:0;bottom:0;z-index:10;transition:.3s;padding:15px;overflow:auto;border-right:2px solid #00e5ff;animation:pulse 2.5s infinite}
#menu.open{left:0}
#menu b{font-size:20px;color:#00e5ff;text-shadow:0 0 10px #00e5ff}
#menu button{background:#0a1a20;color:#fff;border:1px solid #00e5ff33;padding:11px;border-radius:12px;text-align:left;width:100%;margin-top:8px;cursor:pointer}
#menu h4{font-size:11px;color:#00e5ff;margin-top:14px;text-transform:uppercase}
#menu small{color:#aaa;font-size:12px;line-height:1.5;display:block;margin-top:12px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;z-index:5}
#overlay.show{display:block}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.top{padding:13px 15px;border-bottom:2px solid #00e5ff;display:flex;gap:12px;align-items:center;background:#000}
.top button{background:#0a1a20;color:#00e5ff;border:1px solid #00e5ff;padding:9px 12px;border-radius:10px;font-size:18px;animation:pulse 2.5s infinite}
.top span{color:#00e5ff;font-size:12px;margin-left:auto;text-shadow:0 0 8px #00e5ff}
.chat{flex:1;padding:15px;overflow:auto;background:radial-gradient(circle at 50% 0%, #001a22 0%, #000 60%)}
.msg{background:#0a1a20;padding:13px;border-radius:14px;margin-bottom:10px;line-height:1.6;white-space:pre-wrap;word-break:break-word;border:1px solid #00e5ff33}
.msg img{width:100%;border-radius:12px;margin-top:10px;border:1px solid #00e5ff}
.bottom{padding:12px;border-top:2px solid #00e5ff;display:flex;gap:10px;background:#000}
.bottom input{flex:1;padding:14px;border-radius:22px;border:1px solid #00e5ff;background:#0a1a20;color:#fff;outline:none;font-size:15px}
.bottom button{padding:12px 18px;border-radius:22px;border:0;background:#00e5ff;color:#000;font-weight:bold;font-size:18px;box-shadow:0 0 20px #00e5ff}
.tree{font-family:monospace;font-size:12px;color:#a5f3fc;white-space:pre-wrap;line-height:1.6;background:#031014;padding:10px;border-radius:10px;margin-top:8px;border:1px solid #00e5ff33}
.brain{font-size:12px;color:#a5f3fc;background:#031014;padding:10px;border-radius:10px;margin-top:8px;line-height:1.6;border:1px solid #00e5ff33}
</style>
</head>
<body>
<div id="overlay" onclick="toggleMenu()"></div>
<div id="menu">
<b>⚡ K-AI</b>
<button onclick="toggleMenu();pedir('Cria um app de treino')">➕ Novo Projeto</button>
<button onclick="toggleMenu();pedir('Cria uma landing page neon')">🎨 Design</button>
<button onclick="instalar()">⬇️ Instalar App</button>
<h4>🧠 Cérebro K-AI</h4>
<div id="brainInfo" class="brain">Carregando cérebro...</div>
<h4>📁 Estrutura Raiz - GitHub</h4>
<div id="arvore" class="tree">Carregando...</div>
<h4>📱 Meus Apps</h4>
<div id="listaApps"></div>
<small id="status">Conectando...</small>
<small>K-AI FUSÃO REAL<br>Gemini + Groq + Pollinations<br>1 IA só, tempo real<br>Supabase + GitHub</small>
</div>
<div class="main">
<div class="top"><button onclick="toggleMenu()">☰</button><b>K-AI - App Mãe</b><span>● FUSÃO + CÉREBRO ATIVO</span></div>
<div class="chat" id="chat"></div>
<div class="bottom"><input id="txt" placeholder="Pede pro K-AI criar, editar ou evoluir..."><button onclick="enviar()">➤</button></div>
</div>
<script>
const SUPABASE_URL="https://tgccyqvobdmwmwjwntxx.supabase.co";
const SUPABASE_KEY="sb_publishable_2EneNKkowoLF9UiWwB1DDA_Z_RvwPfX";
const GITHUB_REPO="korvil-app/k-ai-app";
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let deferredPrompt, BRAIN=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;});
function instalar(){ if(deferredPrompt) deferredPrompt.prompt(); else alert('Chrome: 3 pontinhos > Adicionar à tela inicial'); }
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
function toggleMenu(){ document.getElementById('menu').classList.toggle('open'); document.getElementById('overlay').classList.toggle('show'); }
async function carregarCerebro(){
  try{ const r=await fetch('https://raw.githubusercontent.com/'+GITHUB_REPO+'/main/brain/memoria.json'); BRAIN=await r.json(); document.getElementById('brainInfo').innerHTML='🧠 <b>'+BRAIN.nome+'</b><br>Versão: '+BRAIN.versao+'<br>Memórias: '+BRAIN.memorias.length+'<br>'+BRAIN.personalidade; }catch(e){ document.getElementById('brainInfo').innerText='🧠 Cérebro v2 ativo'; }
}
async function carregarEstrutura(){
  try{ const res=await fetch('https://api.github.com/repos/'+GITHUB_REPO+'/git/trees/main?recursive=1'); const data=await res.json(); if(!data.tree) return; let txt='k-ai-app/\n'; data.tree.filter(f=>!f.path.includes('.git')).slice(0,80).forEach(f=>{ txt+='  '+(f.type==='tree'?'📁 ':'📄 ')+f.path+'\n'; }); document.getElementById('arvore').innerText=txt; let box=document.getElementById('listaApps'); box.innerHTML=''; let apps=data.tree.filter(f=>f.path.startsWith('apps/') && f.type==='tree'); if(apps.length===0) box.innerHTML='<button>+ Nenhum app ainda</button>'; apps.forEach(a=>{ let nome=a.path.replace('apps/',''); if(nome && !nome.includes('/')) box.innerHTML+='<button onclick="window.open(\'https://korvil-app.github.io/k-ai-app/apps/'+nome+'/\',\'_blank\')">📱 '+nome+'</button>'; }); }catch(e){}
}
function pedir(t){ document.getElementById('txt').value=t; enviar(); }
async function salvar(role,message){ await supabaseClient.from('k_ai_chats').insert({role,message}); }
async function salvarMemoria(conteudo){ await supabaseClient.from('k_ai_memoria').insert({conteudo, tipo:'aprendizado'}); }
async function carregar(){
  const {data,error}=await supabaseClient.from('k_ai_chats').select('*').order('created_at',{ascending:true}).limit(60);
  let c=document.getElementById('chat');
  if(error){ c.innerHTML='<div class="msg"><b>Sistema:</b> Erro Supabase: '+error.message+'<br>Cria a tabela k_ai_chats no SQL que te passei.</div>'; return; }
  if(!data||data.length===0){ c.innerHTML='<div class="msg"><b>K-AI ⚡:</b> Sou 1 única IA evoluída: Gemini + Groq + Pollinations juntas, em tempo real. Meu cérebro tem memória e aprende a cada uso. Tudo que você pedir, eu crio, salvo e evoluo. O que vamos criar agora?</div>'; return; }
  c.innerHTML=''; data.forEach(m=>{ c.innerHTML+='<div class="msg"><b>'+(m.role==='user'?'Você':'K-AI ⚡')+':</b> '+m.message+'</div>'; }); c.scrollTop=c.scrollHeight;
}
async function enviar(){
  let v=document.getElementById('txt').value.trim(); if(!v) return;
  let c=document.getElementById('chat');
  c.innerHTML+='<div class="msg"><b>Você:</b> '+v+'</div>';
  await salvar('user',v); await salvarMemoria('Usuário pediu: '+v);
  document.getElementById('txt').value='';
  c.innerHTML+='<div class="msg" id="loading"><b>K-AI FUSÃO:</b> Gemini + Groq + Pollinations pensando como 1 só em tempo real...</div>'; c.scrollTop=c.scrollHeight;
  try{
    const res=await fetch(SUPABASE_URL+"/functions/v1/k-ai",{method:"POST",headers:{"Authorization":"Bearer "+SUPABASE_KEY,"Content-Type":"application/json"},body:JSON.stringify({prompt:v, cerebro:BRAIN})});
    const txt=await res.text();
    let data={}; try{ data=JSON.parse(txt); }catch(e){ data={resposta:"Erro: a função retornou texto inválido: "+txt.slice(0,300)}; }
    document.getElementById('loading')?.remove();
    if(!res.ok){ c.innerHTML+='<div class="msg"><b>K-AI Erro real:</b> Status '+res.status+' - '+(data.resposta||txt.slice(0,300))+'<br><br>Isso significa que a função k-ai ainda não foi criada ou não foi feito Deploy. Faz o Passo 2 que te passei.</div>'; return; }
    let html='<div class="msg"><b>K-AI ⚡:</b> '+(data.resposta||"Sem resposta da IA").replace(/\n/g,'<br>')+'</div>';
    if(data.imagem) html+='<div class="msg"><b>K-AI Imagem:</b><br><img src="'+data.imagem+'"></div>';
    c.innerHTML+=html; await salvar('assistant',data.resposta||""); await salvarMemoria('K-AI aprendeu: '+v.slice(0,200)); carregarEstrutura();
  }catch(e){ document.getElementById('loading')?.remove(); c.innerHTML+='<div class="msg"><b>K-AI Erro:</b> '+e.message+'</div>'; }
  c.scrollTop=c.scrollHeight;
}
document.getElementById('txt').addEventListener('keydown',e=>{if(e.key==='Enter') enviar();});
carregar(); carregarCerebro(); carregarEstrutura();
</script>
</body>
</html>
