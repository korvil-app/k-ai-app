:root{
  --surface:#f0f2f5;
  --card:#ffffff;
  --primary:#0082ff;
  --green:#42b72a;
  --text:#1c1e21;
  --muted:#65676b;
  --line:#e4e6eb;
  --soft:#e7f3ff;
  --warm:#fff7e6;
  --warm-line:#ffd88a;
}

@media (prefers-color-scheme: dark){
  :root{
    --surface:#121417;
    --card:#1c1e21;
    --text:#f0f2f5;
    --muted:#b0b3b8;
    --line:#2a2d34;
    --soft:#16324f;
    --warm:#2a2417;
    --warm-line:#6b551d;
  }
}

*{
  box-sizing:border-box
}

html,body,#root{
  margin:0;
  padding:0
}

body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:var(--surface);
  color:var(--text)
}

button{
  cursor:pointer;
  border:none;
  font-family:inherit
}

button:disabled{
  opacity:.55;
  cursor:wait
}

input{
  font-family:inherit
}

.shell{
  height:100dvh;
  display:flex;
  background:var(--surface);
  overflow:clip
}

.sidebar{
  width:260px;
  background:var(--card);
  border-right:1px solid var(--line);
  display:flex;
  flex-direction:column;
  flex-shrink:0;
  min-height:0
}

.logo{
  padding:16px;
  font-size:22px;
  font-weight:800;
  color:var(--primary);
  display:flex;
  align-items:center;
  gap:8px
}

.logo span{
  background:var(--primary);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px
}

.newchat{
  margin:0 12px 12px;
  background:var(--primary);
  color:#fff;
  padding:11px;
  border-radius:20px;
  font-weight:600
}

.menu{
  flex:1;
  overflow:auto;
  padding:0 8px;
  min-height:0
}

.menu button{
  display:flex;
  align-items:center;
  gap:10px;
  width:100%;
  text-align:left;
  background:transparent;
  padding:11px 10px;
  border-radius:10px;
  font-size:14px;
  color:var(--text)
}

.menu button:hover{
  background:var(--surface)
}

.menu button.active{
  background:var(--soft);
  color:var(--primary)
}

.menu .tit{
  font-size:11px;
  color:var(--muted);
  padding:10px 10px 4px;
  font-weight:700
}

.bottom{
  padding:10px;
  border-top:1px solid var(--line)
}

.bottom button{
  width:100%;
  padding:11px;
  border-radius:20px;
  font-weight:700;
  margin-top:6px
}

.btn-pub{
  background:var(--primary);
  color:#fff
}

.btn-at{
  background:var(--line);
  color:var(--text)
}

.btn-inst{
  background:var(--green);
  color:#fff
}

.main{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--card);
  min-width:0;
  min-height:0
}

.header{
  padding:12px 18px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap
}

.header b{
  font-size:18px
}

.status{
  font-size:12px;
  color:var(--muted)
}

.status .on{
  color:var(--green);
  font-weight:700
}

.chat{
  flex:1;
  overflow:auto;
  padding:20px;
  max-width:780px;
  width:100%;
  margin:0 auto;
  min-height:0
}

.msg{
  max-width:85%;
  padding:12px 16px;
  border-radius:18px;
  margin:10px 0;
  line-height:1.5;
  font-size:15px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.msg.ai{
  background:var(--surface);
  color:var(--text);
  border-bottom-left-radius:4px
}

.msg.me{
  background:var(--primary);
  color:#fff;
  margin-left:auto;
  border-bottom-right-radius:4px
}

.codebox{
  background:#1c1e21;
  color:#e4e6eb;
  border-radius:12px;
  overflow:hidden;
  margin:10px 0;
  max-width:100%
}

.codehead{
  display:flex;
  gap:6px;
  padding:8px 10px;
  background:#2a2d34;
  align-items:center;
  flex-wrap:wrap
}

.codehead button{
  background:#3a3d46;
  color:#fff;
  padding:7px 10px;
  border-radius:20px;
  font-size:12px
}

.codehead button.on{
  background:var(--primary)
}

.codebox pre{
  margin:0;
  padding:12px;
  overflow:auto;
  font-size:12px;
  max-height:240px;
  white-space:pre-wrap;
  overflow-wrap:anywhere
}

.preview{
  padding:14px;
  background:#fff;
  border:1px dashed var(--primary);
  border-radius:12px;
  color:#050505
}

.preview button{
  width:auto;
  padding:10px 16px;
  background:var(--primary);
  color:#fff;
  border-radius:20px;
  margin:4px
}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin:6px 0
}

.actions button{
  background:var(--surface);
  padding:7px 12px;
  border-radius:20px;
  font-size:12px;
  color:var(--text)
}

.inputbar{
  padding:12px;
  max-width:780px;
  width:100%;
  margin:0 auto
}

.inputwrap{
  border:1px solid #ccd0d5;
  border-radius:24px;
  padding:8px 8px 8px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  box-shadow:0 1px 4px rgba(0,0,0,.08);
  background:var(--card)
}

.inputwrap input{
  flex:1;
  border:none;
  outline:none;
  font-size:15px;
  background:transparent;
  color:var(--text);
  min-width:0
}

.iconbtn{
  width:38px;
  height:38px;
  border-radius:50%;
  background:var(--surface);
  font-size:18px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
  color:var(--text)
}

.iconbtn.send{
  background:var(--primary);
  color:#fff
}

#tokenBox{
  background:var(--warm);
  border:1px solid var(--warm-line);
  padding:12px;
  border-radius:14px;
  margin-bottom:12px
}

#tokenBox input{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccd0d5;
  margin:8px 0;
  background:var(--card);
  color:var(--text)
}

#tokenBox button{
  background:var(--primary);
  color:#fff;
  padding:10px 16px;
  border-radius:20px;
  font-weight:700
}

#voiceInd{
  position:fixed;
  top:70px;
  right:16px;
  background:#050505;
  color:#fff;
  padding:12px 16px;
  border-radius:20px;
  display:none;
  align-items:center;
  gap:10px;
  z-index:99;
  box-shadow:0 4px 20px rgba(0,0,0,.3)
}

#voiceInd.show{
  display:flex
}

#voiceInd .k{
  width:38px;
  height:38px;
  background:var(--primary);
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  animation:pulse 1s infinite
}

@keyframes pulse{
  0%{
    transform:scale(1)
  }

  50%{
    transform:scale(1.15)
  }

  100%{
    transform:scale(1)
  }
}

#listening{
  font-size:12px;
  color:var(--primary);
  text-align:center;
  min-height:16px
}

.save-note{
  font-size:12px;
  color:var(--muted);
  margin:8px 0;
  text-align:center
}

/* Botão flutuante + mini chat */

.fab{
  position:fixed;
  right:16px;
  bottom:16px;
  width:60px;
  height:60px;
  border-radius:50%;
  background:var(--primary);
  color:#fff;
  font-size:28px;
  font-weight:800;
  display:flex;
  align-items:center;
  justify-content:center;
  box-shadow:0 8px 24px rgba(0,130,255,.42);
  z-index:120
}

.fab-dot{
  position:absolute;
  top:3px;
  right:3px;
  width:15px;
  height:15px;
  background:var(--green);
  border:2px solid #fff;
  border-radius:50%
}

.mini{
  position:fixed;
  right:16px;
  bottom:88px;
  width:min(360px,calc(100vw - 32px));
  height:min(520px,calc(100dvh - 170px));
  background:var(--card);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:0 16px 44px rgba(0,0,0,.22);
  display:flex;
  flex-direction:column;
  overflow:hidden;
  z-index:119
}

.mini-head{
  padding:12px 12px 10px;
  background:var(--primary);
  color:#fff;
  display:flex;
  align-items:center;
  gap:9px
}

.mini-head .k{
  width:34px;
  height:34px;
  border-radius:50%;
  background:#fff;
  color:var(--primary);
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0
}

.mini-head .meta{
  flex:1;
  min-width:0;
  line-height:1.25
}

.mini-head .meta b{
  display:block;
  font-size:15px
}

.mini-head .meta small{
  font-size:11px;
  opacity:.92
}

.mini-head button{
  width:32px;
  height:32px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0
}

.mini-body{
  flex:1;
  overflow:auto;
  padding:12px;
  min-height:0
}

.mini-body .msg{
  max-width:92%;
  font-size:14px
}

.mini-foot{
  padding:10px;
  border-top:1px solid var(--line)
}

.mini-input{
  border:1px solid #ccd0d5;
  border-radius:22px;
  padding:6px 6px 6px 12px;
  display:flex;
  align-items:center;
  gap:6px;
  background:var(--card)
}

.mini-input input{
  flex:1;
  border:none;
  outline:none;
  font-size:14px;
  background:transparent;
  color:var(--text);
  min-width:0
}

.mini-input .iconbtn{
  width:34px;
  height:34px;
  font-size:16px
}

.mini-hint{
  font-size:11px;
  color:var(--muted);
  text-align:center;
  margin-top:7px
}

.backdrop{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.28);
  z-index:90;
  display:none
}

.backdrop.show{
  display:block
}

@media(max-width:760px){
  .sidebar{
    display:none
  }

  .sidebar.open{
    display:flex;
    position:fixed;
    left:0;
    top:0;
    bottom:0;
    z-index:100
  }

  .header{
    padding:10px 12px
  }

  .chat{
    padding:14px 12px
  }

  .msg{
    max-width:94%
  }

  .mini{
    right:12px;
    bottom:84px;
    width:calc(100vw - 24px)
  }

  .fab{
    right:12px;
    bottom:12px
  }
}
