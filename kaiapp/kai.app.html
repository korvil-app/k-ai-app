<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#fff;color:#111;display:flex;height:100vh;overflow:hidden}
button{cursor:pointer;border:none}
.sidebar{width:260px;background:#fff;border-right:1px solid #ddd;display:none;flex-direction:column;position:fixed;left:0;top:0;bottom:0;z-index:100;box-shadow:2px 0 10px rgba(0,0,0,.1)}
.sidebar.open{display:flex}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:90}
.overlay.show{display:block}
.logo{padding:16px;font-weight:800;color:#0082ff;font-size:22px}
.menu{flex:1;overflow:auto;padding:0 8px}
.menu button{width:100%;text-align:left;background:transparent;padding:12px;border-radius:10px;font-size:14px}
.menu button:hover{background:#f0f2f5}
.bottom{padding:10px;border-top:1px solid #ddd}
.bottom button{width:100%;padding:12px;border-radius:20px;font-weight:700;margin-top:6px}
.btn-pub{background:#0082ff;color:#fff}.btn-at{background:#eee}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.header{padding:12px 16px;border-bottom:1px solid #ddd;display:flex;justify-content:space-between;align-items:center}
.chat{flex:1;overflow:auto;padding:20px;max-width:780px;width:100%;margin:0 auto}
.msg{max-width:85%;padding:12px 16px;border-radius:18px;margin:10px 0;font-size:15px}
.msg.ai{background:#f0f2f5}.msg.me{background:#0082ff;color:#fff;margin-left:auto}
.codebox{background:#111;color:#fff;border-radius:12px;margin:10px 0;overflow:hidden}
.codehead{display:flex;gap:6px;padding:8px;background:#333;flex-wrap:wrap}
.codehead button{background:#555;color:#fff;padding:7px 10px;border-radius:20px;font-size:12px}
.codebox pre{padding:12px;font-size:12px;margin:0;overflow:auto}
.preview{padding:14px;background:#fff;border:1px dashed #0082ff;border-radius:12px;color:#000}
.preview button{padding:10px 16px;background:#0082ff;color:#fff;border-radius:20px}
/* CAIXA DO CHAT EMBAIXO SEMPRE VISIVEL */
.inputbar{padding:12px;max-width:780px;width:100%;margin:0 auto;border-top:1px solid #eee}
.inputwrap{border:1px solid #ccc;border-radius:24px;padding:8px 8px 8px 16px;display:flex;gap:8px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.08)}
.inputwrap input{flex:1;border:none;outline:none;font-size:15px}
.iconbtn{width:38px;height:38px;border-radius:50%;background:#f0f2f5;font-size:18px;display:flex;align-items:center;justify-content:center}
.iconbtn.send{background:#0082ff;color:#fff}
#voiceInd{position:fixed;top:70px;right:16px;background:#000;color:#fff;padding:10px 16px;border-radius:20px;display:none;z-index:200}
#tokenBox{background:#fff7e6;border:1px solid #ffd88a;padding:12px;border-radius:14px;margin-bottom:12px}
#tokenBox input{width:100%;padding:10px;border-radius:10px;border:1px solid #ccc;margin:8px 0}
#tokenBox button{background:#0082ff;color:#fff;padding:10px 16px;border-radius:20px}
</style>
</head>
<body>
<div class="overlay" id="overlay" onclick="fecharMenu()"></div>
<div class="sidebar" id="sidebar">
<div class="logo">K K-AI</div>
<div class="menu">
<button onclick="showTab('chat');fecharMenu()">💬 Chat</button>
<button onclick="showTab('criar');fecharMenu()">✨ Criar imagem</button>
<button onclick="showTab('codigo');fecharMenu()">💻 Código</button>
<button onclick="showTab('memoria');fecharMenu()">🧠 Memória</button>
<button onclick="showTab('supabase');fecharMenu()">🟢 Supabase</button>
<button onclick="showTab('github');fecharMenu()">⚫ GitHub</button>
<button onclick="showTab('evoluir');fecharMenu()">🚀 Evoluir</button>
<button onclick="showTab('config');fecharMenu()">⚙️ Config</button>
</div>
<div class="bottom">
<button class="btn-at" onclick="atualizarTela()">ATUALIZAR</button>
<button class="btn-pub" onclick="publicar()">PUBLICAR</button>
</div>
</div>

<div class="main">
<div class="header">
<button class="iconbtn" onclick="toggleMenu()">☰</button>
<b>K-AI</b><span id="statusTxt" style="font-size:12px">Token: <span id="tokStat">Não salvo</span></span>
</div>

<div class="chat" id="chat" onclick="fecharMenu()">
<div id="tokenBox"><b>Ativar código mestre</b><br><small>Cole o KAI_TOKEN 1 vez só.</small>
<input id="token" type="password" placeholder="Cole KAI_TOKEN">
<button onclick="ativar()">ATIVAR</button>
<div id="msg" style="font-size:13px;margin-top:6px">Aguardando...</div></div>
<div class="msg ai">Oi! Eu sou o K-AI 😊 Me fala o que quer criar que eu já faço e mostro aqui na hora.</div>
<div id="areaPreview"></div>
</div>

<!-- CAIXA DO CHAT EMBAIXO -->
<div class="inputbar">
<div id="listening" style="font-size:12px;color:#0082ff;text-align:center"></div>
<div class="inputwrap">
<button class="iconbtn" onclick="ouvirUmaVez()">🎤</button>
<input id="pergunta" placeholder="Pergunte ao K-AI... ou fale 'kai'">
<button class="iconbtn send" onclick="falar()">➤</button>
</div>
<div style="text-align:center;font-size:11px;color:#888;margin-top:4px">K-AI • GEMINI + GROQ + POLLINATIONS • Fale "kai"</div>
</div>
</div>
<div id="voiceInd"><b>K K-AI ativo</b> - Estou te ouvindo...</div>

<script>
// MENU: abre / fecha, nunca travado
function toggleMenu(){
  const s=document.getElementById('sidebar'),o=document.getElementById('overlay');
  const aberto=s.classList.contains('open');
  if(aberto){fecharMenu()}else{s.classList.add('open');o.classList.add('show')}
}
function fecharMenu(){
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
function falarVoz(t){try{const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';speechSynthesis.speak(u)}catch(e){}}
function bip3(){try{const c=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(x=>{const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;o.start(c.currentTime+x);o.stop(c.currentTime+x+.15)})}catch(e){}}
function carregar(){try{const t=localStorage.getItem('KAI_TOKEN')||'';if(t){document.getElementById('tokStat').innerText='Salvo ****'+t.slice(-4);document.getElementById('tokenBox').style.display='none'}}catch(e){}}carregar();
function ativar(){const t=document.getElementById('token').value.trim();if(!t){alert('Cole o token');return}localStorage.setItem('KAI_TOKEN',t);carregar();document.getElementById('msg').innerText='ATIVADO!';falarVoz('Pronto, ativei.')}
function showTab(t){const m={supabase:'<div class="msg ai"><b>Supabase</b><br>k-ai-v2 OK | Tabelas kaiapp_v2_ | Bucket kaiapp-v2</div>',github:'<div class="msg ai"><b>GitHub</b><br>Repo korvil-app/k-ai-app | Pasta kaiapp/ | Clique PUBLICAR</div>',criar:'<div class="msg ai"><b>Criar imagem</b><br>Descreve a imagem que eu crio.</div>',codigo:'<div class="msg ai"><b>Código</b><br>Pede um botão, site ou app que eu crio.</div>',memoria:'<div class="msg ai"><b>Memória</b><br>Eu lembro do que você gosta.</div>',evoluir:'<div class="msg ai"><b>Evoluir</b><br>Fala: kai, evoluir, mude a página</div>',config:'<div class="msg ai"><b>Config</b><br>Voz ATIVA | Token salvo</div>',chat:'<div class="msg ai">Voltamos pro chat!</div>'};if(m[t])document.getElementById('chat').innerHTML+=m[t]}
function atualizarTela(){document.getElementById('msg')&&(document.getElementById('msg').innerText='Atualizado na hora em tempo real!');falarVoz('Atualizei na hora.')}
let c=0;const vars=["Boa, entendi! Já fiz aqui","Feito! Olha como ficou","Prontinho! Já atualizei em tempo real","Show, já coloquei!"];
function falar(){const inp=document.getElementById('pergunta');const p=inp.value.trim();if(!p)return;const chat=document.getElementById('chat');chat.innerHTML+='<div class="msg me">'+p+'</div>';inp.value='';c++;const saud=vars[c%vars.length];const low=p.toLowerCase();if(low.includes('botão')||low.includes('botao')||low.includes('código')||low.includes('codigo')||low.includes('site')){let nome='Meu Botão';const mm=p.match(/botão (?:de |do |da )?(.+)/i);if(mm)nome=mm[1].trim();const id='c'+Date.now();chat.innerHTML+='<div class="msg ai">'+saud+'</div><div class="codebox"><div class="codehead"><button onclick="toggleCode(\''+id+'\',\'code\')">Ver código</button><button onclick="toggleCode(\''+id+'\',\'prev\')">Ver funcionando</button><button onclick="copiar(\''+id+'\')">Copiar</button><button onclick="baixar(\''+id+'\')">Baixar</button><button onclick="compartilhar(\''+id+'\')">Compartilhar</button></div><pre id="'+id+'-code">&lt;button&gt;'+nome+'&lt;/button&gt;</pre><div id="'+id+'-prev" class="preview" style="display:none"><button onclick="alert(\''+nome+' funcionando!\')">'+nome+'</button></div></div>';falarVoz(saud+' Criei o botão '+nome)}else{chat.innerHTML+='<div class="msg ai">'+saud+'<br>Entendi: <b>'+p+'</b><br>Já deixei atualizado em tempo real. Quer continuar?</div>';falarVoz(saud)}chat.scrollTop=chat.scrollHeight}
function toggleCode(id,t){const co=document.getElementById(id+'-code'),pr=document.getElementById(id+'-prev');if(t==='code'){co.style.display='block';pr.style.display='none'}else{co.style.display='none';pr.style.display='block'}}
function copiar(id){navigator.clipboard.writeText(document.getElementById(id+'-code').innerText);alert('Copiado!')}
function baixar(id){const a=document.createElement('a');a.href='data:text/html,[STRIPPED] a.download='kai.html';a.click()}
function compartilhar(id){const t=document.getElementById(id+'-code').innerText;if(navigator.share)navigator.share({text:t});else{navigator.clipboard.writeText(t);alert('Copiado!')}}
let ouvindo=false,timer=null;
function mostrarVoz(m){document.getElementById('voiceInd').style.display=m?'block':'none'}
function ouvirUmaVez(){ativarVoz()}
function ativarVoz(){if(ouvindo)return;ouvindo=true;bip3();mostrarVoz(true);document.getElementById('listening').innerText='Estou te ouvindo...';falarVoz('Oi criador, estou te ouvindo. O que você quer que eu faça?');clearTimeout(timer);timer=setTimeout(()=>{mostrarVoz(false);document.getElementById('listening').innerText='';ouvindo=false},8000)}
try{const Rec=window.SpeechRecognition||window.webkitSpeechRecognition;if(Rec){const rec=new Rec();rec.lang='pt-BR';rec.continuous=true;rec.interimResults=true;rec.onresult=(e)=>{const txt=e.results[e.results.length-1][0].transcript;document.getElementById('pergunta').value=txt;const low=txt.toLowerCase();if(low.includes('kai')||low.includes('cai')||low.includes('kay')){if(!ouvindo)ativarVoz();clearTimeout(timer);timer=setTimeout(()=>{mostrarVoz(false);document.getElementById('listening').innerText='';ouvindo=false;const v=document.getElementById('pergunta').value.trim();if(v&&v.toLowerCase()!=='kai'&&v.length>4)falar()},3000)}};rec.onend=()=>{try{rec.start()}catch(e){}};rec.start()}}catch(e){}
document.getElementById('pergunta').addEventListener('keydown',e=>{if(e.key==='Enter')falar()});

// PUBLICAR - CRIA + ATUALIZA + ENVIA TUDO EM kaiapp/ + TEMPO REAL
async function publicar(){
  const token=localStorage.getItem('KAI_TOKEN');
  if(!token){alert('Ative o token primeiro');return}
  const el=document.getElementById('msg'); if(el) el.innerText='Publicando... criando e atualizando TUDO em kaiapp/...';
  document.getElementById('chat').innerHTML+='<div class="msg ai">Publicando... criando e atualizando todos os arquivos em kaiapp/ em tempo real...</div>';
  try{
    const htmlAtual='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const arquivos={
      'kaiapp/kai.app.html':htmlAtual,
      'kaiapp/index.html':htmlAtual,
      'kaiapp/manifest.json':JSON.stringify({name:"K-AI",short_name:"K-AI",display:"standalone",start_url:"./kai.app.html",background_color:"#ffffff",theme_color:"#0082ff"}),
      'kaiapp/funcoes/evoluir.js':'// Evoluir - mantem tudo, so adiciona o novo',
      'kaiapp/funcoes/evoluir.descricao.md':'# Evoluir\nKai evoluir mantem tudo e so adiciona.',
      'kaiapp/funcoes/comando-voz.descricao.md':'# Voz\nFalar kai, bip 3x, icone K-AI, diz oi criador estou te ouvindo, digita o que fala, 3s sem falar volta standby.',
      'kaiapp/README.md':'# K-AI APP\nApp criado pelo K-AI em tempo real.',
      'index.html':'<meta http-equiv="refresh" content="0; url=kaiapp/kai.app.html">'
    };
    let ok=0;
    for(const path in arquivos){
      const get=await fetch('https://api.github.com/repos/korvil-app/k-ai-app/contents/'+path,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});
      let sha=null; if(get.ok){const j=await get.json(); sha=j.sha}
      const body={message:'K-AI: publicar tempo real - '+path,content:btoa(unescape(encodeURIComponent(arquivos[path]))),branch:'main'};
      if(sha) body.sha=sha;
      const put=await fetch('https://api.github.com/repos/korvil-app/k-ai-app/contents/'+path,{method:'PUT',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json',Accept:'application/vnd.github+json'},body:JSON.stringify(body)});
      if(!put.ok) throw new Error('Erro em '+path);
      ok++;
    }
    if(el) el.innerText='PUBLICADO! '+ok+' arquivos criados/atualizados em kaiapp/ em tempo real!';
    document.getElementById('chat').innerHTML+='<div class="msg ai">Pronto! Publiquei '+ok+' arquivos em kaiapp/ e já atualizei em tempo real. Recarrega a página que já aparece atualizado.</div>';
    falarVoz('Publicado com sucesso, criador.');
  }catch(e){ if(el) el.innerText='Erro: '+e.message; document.getElementById('chat').innerHTML+='<div class="msg ai">Erro ao publicar: '+e.message+' - Verifica se o token está certo.</div>'; }
}
</script>
</body>
</html>
